<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Incremental RPG</title>
    <!-- Installable web app. Relative URLs so both / and /games/ deployments resolve. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#ff8fb1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RPG" />
    <style>
      /* Fredoka — SIL Open Font License 1.1, see CREDITS.md.
         Relative URL so it resolves under both / and /games/ deployments. */
      @font-face {
        font-family: 'Fredoka';
        src: url('assets/fonts/Fredoka.ttf') format('truetype');
        font-weight: 300 700;
        font-display: swap;
      }
      /* Fredoka is Latin-only. Mitr carries the Thai script and is rounded
         enough to sit beside it; the browser picks per glyph, so mixed
         Thai/Latin strings stay visually consistent. */
      @font-face {
        font-family: 'Mitr';
        src: url('assets/fonts/Mitr-Regular.ttf') format('truetype');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Mitr';
        src: url('assets/fonts/Mitr-SemiBold.ttf') format('truetype');
        font-weight: 600 700;
        font-display: swap;
      }
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #ffe9f0;
        font-family: 'Fredoka', 'Mitr', 'Trebuchet MS', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
